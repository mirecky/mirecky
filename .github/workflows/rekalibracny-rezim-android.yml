name: Rekalibračný režim – Android APK

on:
  push:
    paths:
      - "RekalibracnyRezim/**"
      - ".github/workflows/rekalibracny-rezim-android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: RekalibracnyRezim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RekalibracnyRezim/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run android:sync

      - name: Zostavenie APK (debug)
        working-directory: RekalibracnyRezim/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rekalibracny-rezim-apk
          path: RekalibracnyRezim/android/app/build/outputs/apk/debug/app-debug.apk

      # Stály odkaz na stiahnutie do mobilu (bez ZIP-u a prihlásenia):
      # https://github.com/<repo>/releases/download/rekalibracny-rezim/rekalibracny-rezim.apk
      - name: Zverejnenie APK ako release
        working-directory: RekalibracnyRezim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rekalibracny-rezim.apk
          gh release delete rekalibracny-rezim --yes --cleanup-tag || true
          gh release create rekalibracny-rezim rekalibracny-rezim.apk \
            --target "$GITHUB_SHA" \
            --title "Rekalibračný režim – APK" \
            --notes "Zostavené z ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
